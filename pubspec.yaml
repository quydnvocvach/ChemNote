name: chemnote
description: >-
  ChemNote - Ứng dụng ghi chú viết tay kiểu GoodNotes dành cho sinh viên Hóa học
  trên Android và Huawei HarmonyOS 2/3/4 với đồng bộ Google Drive không cần GMS.
publish_to: 'none'
version: 3.6.5+21

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  flutter_web_auth_2: ^4.0.1
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.0
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.4
  intl: ^0.19.0
  share_plus: ^10.1.2
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
