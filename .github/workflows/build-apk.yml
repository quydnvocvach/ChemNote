name: Build ChemNote APK (Huawei MatePad 11.5"S & Android)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK (144Hz + M-Pencil 3 + GMS-Free)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate modern Android Gradle setup while preserving custom MatePad native files & fixed signing key
        run: |
          mkdir -p /tmp/chemnote_backup
          cp -r android/app/src/main/kotlin /tmp/chemnote_backup/kotlin
          cp android/app/src/main/AndroidManifest.xml /tmp/chemnote_backup/AndroidManifest.xml
          cp -r android/app/src/main/res /tmp/chemnote_backup/res
          cp android/app/chemnote-release.p12 /tmp/chemnote_backup/chemnote-release.p12

          # Remove legacy Groovy files so flutter create generates clean Flutter Stable Gradle KTS files
          rm -rf android
          flutter create --platforms=android --org com.chemnote --project-name chemnote .
          rm -f test/widget_test.dart

          # Restore custom 144Hz + M-Pencil 3 + MediaRecorder/MediaPlayer + MediaStore native files & vector icons
          rm -rf android/app/src/main/kotlin
          cp -r /tmp/chemnote_backup/kotlin android/app/src/main/kotlin
          cp /tmp/chemnote_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/chemnote_backup/res/* android/app/src/main/res/
          cp /tmp/chemnote_backup/chemnote-release.p12 android/app/chemnote-release.p12

          # Convert fixed PKCS12 keystore to JKS with deterministic alias "chemnote" so every future APK shares the exact same signature
          SRC_ALIAS=$(keytool -list -keystore android/app/chemnote-release.p12 -storetype PKCS12 -storepass chemnote2026 | grep "PrivateKeyEntry" | head -n 1 | cut -d',' -f1)
          keytool -importkeystore \
            -srckeystore android/app/chemnote-release.p12 -srcstoretype PKCS12 -srcstorepass chemnote2026 -srcalias "$SRC_ALIAS" \
            -destkeystore android/app/chemnote-release.jks -deststoretype JKS -deststorepass chemnote2026 -destalias chemnote -destkeypass chemnote2026 -noprompt

          # Patch generated build.gradle.kts (or build.gradle) for com.chemnote.app, minSdk 23, compileSdk 36 & permanent release signing
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = .*/applicationId = "com.chemnote.app"/' android/app/build.gradle.kts
            sed -i 's/namespace = .*/namespace = "com.chemnote.app"/' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle.kts
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
            python3 - << 'PYEOF'
          p = "android/app/build.gradle.kts"
          txt = open(p, "r", encoding="utf-8").read()
          signing_block = '''    signingConfigs {
              create("release") {
                  storeFile = file("chemnote-release.jks")
                  storePassword = "chemnote2026"
                  keyAlias = "chemnote"
                  keyPassword = "chemnote2026"
              }
          }

              buildTypes {'''
          txt = txt.replace("    buildTypes {", signing_block, 1)
          txt = txt.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          open(p, "w", encoding="utf-8").write(txt)
          PYEOF
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/applicationId .*/applicationId = "com.chemnote.app"/' android/app/build.gradle
            sed -i 's/namespace .*/namespace = "com.chemnote.app"/' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk = 23/' android/app/build.gradle
            sed -i 's/compileSdk .*/compileSdk = 36/' android/app/build.gradle
          fi

          # Ensure ALL plugin subprojects (e.g. :file_picker) compile with SDK 36 & skip AGP lintVital bug
          if [ -f android/build.gradle.kts ]; then
            cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              if (name != "app") {
                  afterEvaluate {
                      extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.apply {
                          compileSdkVersion(36)
                      }
                  }
              }
              tasks.matching { it.name.contains("lintVital", ignoreCase = true) }.configureEach {
                  enabled = false
              }
          }
          EOF
          elif [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle

          subprojects {
              if (name != "app") {
                  afterEvaluate { project ->
                      if (project.hasProperty("android")) {
                          project.android {
                              compileSdkVersion 36
                          }
                      }
                  }
              }
              tasks.matching { it.name.toLowerCase().contains("lintvital") }.configureEach {
                  enabled = false
              }
          }
          EOF
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run unit tests
        run: |
          flutter test --reporter expanded | tee test_output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          if [ "$TEST_EXIT" -ne 0 ]; then
            grep -E "\[E\]|Expected:|Actual:|Failed to load|Error:" test_output.txt | head -n 30 | while IFS= read -r line; do
              echo "::error title=UnitTest::$line"
            done
          fi
          exit $TEST_EXIT

      - name: Build Release APK for Huawei MatePad 11.5"S & Android
        run: |
          flutter build apk --release 2>&1 | tee build_output.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            tr '\r' '\n' < build_output.txt | grep -v -E "Unzipping|Downloading|^\[" | grep -E "FAILURE:|What went wrong|Execution failed|Error:|Exception:|Cannot |e: |Caused by:" -A 2 | tail -n 25 | while IFS= read -r line; do
              echo "::error title=ApkBuild::$line"
            done
          fi
          exit $BUILD_EXIT

      - name: Rename Release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ChemNote-MatePad-11.5s-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChemNote-MatePad-11.5s-APK
          path: ChemNote-MatePad-11.5s-release.apk
          if-no-files-found: error

      - name: Publish Release v3.8.0 with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.8.0
          name: ChemNote Pro v3.8.0 (Lưới Ảnh gần đây 12 ảnh + Xem trước, Chống tì tay 3 tầng & Khóa zoom nổi)
          body: |
            ### ChemNote Pro v3.8.0
            - **Khung chọn *Ảnh gần đây* hoàn toàn mới (8–12 ảnh cùng lúc + Xem trước):**
              - Mở rộng khung xem trên màn hình lớn với lưới **4 cột × 3 hàng (12 ảnh hiển thị ngay)** và cuộn xem tới **24 ảnh gần đây**; đưa 2 nút *Chụp ảnh* và *Bộ sưu tập* gọn lên thanh tiêu đề, nâng độ phân giải ảnh thu nhỏ lên 380px cho chữ và công thức sắc nét rõ ràng.
              - Thêm nút kính lúp (`🔍` ở góc từng ảnh hoặc **nhấn giữ ảnh**) để mở toàn ảnh phóng to (`InteractiveViewer` 1×–4×) trước khi bấm **Chèn vào trang**.
            - **Chống tì tay 3 tầng triệt để:**
              1. *Lá chắn phần cứng Android (`MainActivity`)*: Lọc và hủy tức thì chạm lòng bàn tay (`TOOL_TYPE_PALM`, diện tích chạm lớn, `FLAG_CANCELED`) hoặc chạm phát sinh khi M-Pencil 3 đang lơ lửng/viết và trong cooldown 480ms ngay trong vùng giấy viết.
              2. *Tầng `PalmRejectionFilter` (`StrokeEngine`)*: Mở rộng cooldown 550ms và nhận diện `isLikelyPalmTouch` theo bán kính/kích thước tiếp xúc.
              3. *Khóa viewport & hoàn tác dịch chuyển sớm (`NoteEditorScreen`)*: Thêm ngưỡng trượt ngón đơn 12px, giữ nguyên trạng thái hover khi đặt tay và tự động hoàn tác ngay các vi dịch chuyển/zoom do lòng bàn tay chạm trước bút vài trăm ms.
            - **Viên thuốc Khóa Zoom kèm `%` phóng đại (`Huawei Notes style`):** Khi zoom trang một chút, viên thuốc mờ nổi ở đáy màn hình hiện ra với biểu tượng khóa + `%` zoom theo thời gian thực; chạm để khóa/mở khóa tỉ lệ zoom (giữ nguyên khả năng cuộn/di chuyển trang), tự ẩn khi không thao tác và tự hiện lại khi bạn chụm/giãn ngón tay để nhắc trạng thái khóa.
          files: ChemNote-MatePad-11.5s-release.apk
          make_latest: true
