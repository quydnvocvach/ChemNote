name: Build ChemNote APK (Huawei MatePad 11.5"S & Android)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK (144Hz + M-Pencil 3 + GMS-Free)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Gradle wrapper while preserving custom MatePad native files
        run: |
          mkdir -p /tmp/chemnote_backup
          cp -r android/app/src/main/kotlin /tmp/chemnote_backup/kotlin
          cp android/app/src/main/AndroidManifest.xml /tmp/chemnote_backup/AndroidManifest.xml
          cp android/app/build.gradle /tmp/chemnote_backup/app_build.gradle
          cp -r android/app/src/main/res /tmp/chemnote_backup/res

          flutter create --platforms=android --org com.chemnote --project-name chemnote .

          rm -f android/app/build.gradle.kts
          cp -r /tmp/chemnote_backup/kotlin/* android/app/src/main/kotlin/
          cp /tmp/chemnote_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/chemnote_backup/app_build.gradle android/app/build.gradle
          cp -r /tmp/chemnote_backup/res/* android/app/src/main/res/

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run unit tests
        continue-on-error: true
        run: |
          flutter test --reporter expanded | tee test_output.txt
          TEST_EXIT=${PIPESTATUS[0]}
          if [ "$TEST_EXIT" -ne 0 ]; then
            grep -E "\[E\]|Expected:|Actual:|Failed to load|Error:" test_output.txt | head -n 30 | while IFS= read -r line; do
              echo "::warning title=UnitTest::$line"
            done
          fi
          exit $TEST_EXIT

      - name: Build Release APK for Huawei MatePad 11.5"S & Android
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ChemNote-MatePad-11.5s-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChemNote-MatePad-11.5s-APK
          path: ChemNote-MatePad-11.5s-release.apk
          if-no-files-found: error

      - name: Publish Release v3.0.0 with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: ChemNote Pro v3.0.0 (Huawei MatePad 11.5"S & Android)
          body: |
            ### ChemNote Pro v3.0.0 — Native APK cho Huawei MatePad 11.5"S & Android
            - Tối ưu phần cứng **144Hz PaperMatte** + **M-Pencil 3 (NearLink)** (gõ đúp thân bút đổi Bút ↔ Tẩy).
            - **Ghi âm bài giảng đồng bộ nét viết tay (Audio Note Replay)** dùng `MediaRecorder` / `MediaPlayer` gốc Android.
            - **Cân bằng phương trình phân tử & phương trình ion** (`MnO4- + Fe2+ + H+ -> Mn2+ + Fe3+ + H2O`).
            - **10 mẫu giấy thẩm mỹ**, cắt ảnh độ phân giải gốc không vỡ nét, nhập/xuất PDF, đồng bộ Google Drive **không cần GMS**.
            - Tích hợp **Kiểm tra cập nhật APK** trực tiếp trong Cài đặt.
          files: ChemNote-MatePad-11.5s-release.apk
          make_latest: true
